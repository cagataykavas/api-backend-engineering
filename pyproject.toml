[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-backend-engineering"
version = "1.3.0"
description = "Production-shaped FastAPI backend with idempotency, Postgres, Redis and observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "asyncpg>=0.30",
  "redis>=6.2",
  "PyJWT>=2.10",
  "prometheus-client>=0.22",
  "opentelemetry-api>=1.36",
  "opentelemetry-sdk>=1.36",
  "opentelemetry-exporter-otlp>=1.36",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "httpx>=0.28",
  "locust>=2.37",
  "ruff>=0.12",
]

[tool.setuptools]
py-modules = ["app", "auth", "cache", "orders", "telemetry"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "storage*"]

[tool.setuptools.package-data]
storage = ["sql/*.sql"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
